name: Sync and build

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - name: Merge upstream into main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          result=$(gh api repos/${{ github.repository }}/merge-upstream \
            -f branch=main --jq .merge_type)
          echo "merge_type: $result"
          if [ "$result" = "none" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Cache CMake Build
        uses: hendrikmuhs/ccache-action@v1.2.21
        env:
          cache-name: ${{ runner.os }}-sdl-cache-cmake-build
        with:
          append-timestamp: false
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Configure CMake
        run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: shadps4-win64-sdl
          path: ${{github.workspace}}/build/shadPS4.exe
          path: |
            build/Release/*.exe
            build/Release/*.dll
